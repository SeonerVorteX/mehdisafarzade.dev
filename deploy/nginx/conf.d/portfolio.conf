# mehdisafarzade.dev: http{}-level pieces (rate-limit zones). Installed at
# /etc/nginx/conf.d/portfolio.conf so the shared nginx.conf is never edited.
# `limit_req_status 429;` is already set globally in the server's nginx.conf.

# POST api.mehdisafarzade.dev/v1/contact: coarse edge backstop; the API applies
# the precise per-IP-hash / per-email limits in Redis.
limit_req_zone $binary_remote_addr zone=pf_contact:10m rate=10r/m;

# admin.mehdisafarzade.dev/api/auth/*: behind the device gate already; the API's
# own login throttle + per-account lockout are the precise layer.
limit_req_zone $binary_remote_addr zone=pf_admin_auth:10m rate=30r/m;
