# ─────────────────────────────────────────────────────────────────────────────
# Device gate: http{}-level maps (PLAN.md §8.2). GENERIC and site-agnostic.
#
# Installed at /etc/nginx/conf.d/device-gate.conf (nginx.conf already includes
# conf.d/*.conf inside http{}). Every map is keyed on "$host:<secret>", so one set
# of maps serves every gated site; each site only adds its own files under
# /etc/nginx/device-gate/ (root 0700, files 0600, NEVER in any git repo):
#
#   <host>.map     "<host>:<device-token>"  <device-name>;  # enrolled <date>
#   <host>.unlock  "<host>:<unlock-key>"    <device-token>;   (exists only during an enrollment)
#
# Must be loaded before any server{} that includes snippets/device-gate.conf (it
# defines the dg_enroll log format). On the server, vhosts live in sites-enabled/,
# which nginx.conf includes after conf.d/.
#
# Written only by deploy/device-gate/gate.ps1. To gate another site: add its
# `include snippets/device-gate.conf;` and enroll a device with -Site <name>.
# ─────────────────────────────────────────────────────────────────────────────

# Map keys are "<host>:<43-char secret>" (68+ chars), longer than the default
# 64-byte bucket: without this, nginx refuses to load ("could not build map_hash").
# Found by the gate test harness. Not set anywhere in the server's nginx.conf (checked
# 2026-09-25 with `nginx -T`), so defining it here doesn't duplicate it.
map_hash_bucket_size 128;

# The token from the `__Host-dg` cookie. A regex over $http_cookie because an
# nginx variable name can't contain '-', so $cookie___Host-dg doesn't work.
# The name must be preceded by the start of the header or "; " so
# "x__Host-dg=<token>" does not match.
map $http_cookie $dg_token {
    default "";
    "~(?:^|;\s*)__Host-dg=(?<dg_cookie_token>[A-Za-z0-9_-]{43})(?:\s*;|$)" $dg_cookie_token;
}

# Device name for the presented token (empty = not enrolled → 404).
map "$host:$dg_token" $dg_device {
    default "";
    include /etc/nginx/device-gate/*.map;
}

# Token to hand out for a live unlock key (empty = no enrollment in progress → 404).
map "$host:$arg_k" $dg_unlock_token {
    default "";
    include /etc/nginx/device-gate/*.unlock;
}

# Device name for the token being handed out; logged so gate.ps1 can see the
# enrollment land (no secret is ever logged).
map "$host:$dg_unlock_token" $dg_unlock_device {
    default "";
    include /etc/nginx/device-gate/*.map;
}

limit_req_zone $binary_remote_addr zone=dg_unlock:1m rate=6r/m;

# Secret-free enrollment log: time, host, device, status. No request line, query or cookie.
log_format dg_enroll '$time_iso8601 $host $dg_unlock_device $status';
