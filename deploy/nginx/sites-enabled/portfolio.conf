# ─────────────────────────────────────────────────────────────────────────────
# mehdisafarzade.dev vhosts (PLAN.md §9.4).
# Source of truth: this repo (deploy/nginx/). Copied into the Examination VPS mirror
# and deployed with its deploy-nginx.sh only after an approved diff (Phase 9).
#
# Requires (all under /etc/nginx):
#   conf.d/device-gate.conf, conf.d/portfolio.conf          (http-level maps / zones)
#   snippets/device-gate.conf, portfolio-proxy.conf, portfolio-origin-tls.conf
#   upstreams/portfolio_{api,web,admin}_targets.conf        (CI-generated blue/green)
#   device-gate/admin.mehdisafarzade.dev.map                (secret; written by gate.ps1 only)
# Every portfolio container publishes on 127.0.0.1 only; nginx is the only way in.
# ─────────────────────────────────────────────────────────────────────────────

upstream portfolio_api_upstream {
    include /etc/nginx/upstreams/portfolio_api_targets.conf;
    keepalive 16;
}

upstream portfolio_web_upstream {
    include /etc/nginx/upstreams/portfolio_web_targets.conf;
    keepalive 16;
}

upstream portfolio_admin_upstream {
    include /etc/nginx/upstreams/portfolio_admin_targets.conf;
    keepalive 8;
}

# ── HTTP → HTTPS (Cloudflare "Always Use HTTPS" normally handles this first) ──
server {
    listen 80;
    listen [::]:80;
    server_name mehdisafarzade.dev www.mehdisafarzade.dev api.mehdisafarzade.dev admin.mehdisafarzade.dev;
    return 301 https://$host$request_uri;
}

# ── apex → www (fallback for the Cloudflare Redirect Rule) ───────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mehdisafarzade.dev;
    include /etc/nginx/snippets/portfolio-origin-tls.conf;

    return 301 https://www.mehdisafarzade.dev$request_uri;
}

# ── www: public site ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mehdisafarzade.dev;
    include /etc/nginx/snippets/portfolio-origin-tls.conf;

    client_max_body_size 64k;

    location /_next/static/ {
        include /etc/nginx/snippets/portfolio-proxy.conf;
        proxy_set_header X-Admin-Device "";
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_pass http://portfolio_web_upstream;
    }

    location / {
        include /etc/nginx/snippets/portfolio-proxy.conf;
        proxy_set_header X-Admin-Device "";
        proxy_pass http://portfolio_web_upstream;
    }
}

# ── api: public, read-mostly API ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mehdisafarzade.dev;
    include /etc/nginx/snippets/portfolio-origin-tls.conf;

    # Uploads go browser → S3 via presigned PUT; the API never takes large bodies.
    client_max_body_size 1m;

    # The admin API does not exist on this host. Case-insensitive on purpose: nginx
    # decodes %XX and merges slashes before matching, but it doesn't fold case,
    # so /V1/Admin must be caught here too (PLAN.md §15 R2). The API also refuses
    # admin routes without the gate header, and routes case-sensitively.
    location ~* ^/v1/admin(?:/|$) {
        return 404;
    }

    # Deploy health checks hit the container port directly, never this vhost.
    location = /v1/health {
        allow 127.0.0.1;
        deny all;
        include /etc/nginx/snippets/portfolio-proxy.conf;
        proxy_set_header X-Admin-Device "";
        proxy_pass http://portfolio_api_upstream;
    }

    location = /v1/contact {
        limit_req zone=pf_contact burst=5 nodelay;
        include /etc/nginx/snippets/portfolio-proxy.conf;
        proxy_set_header X-Admin-Device "";
        proxy_pass http://portfolio_api_upstream;
    }

    location / {
        include /etc/nginx/snippets/portfolio-proxy.conf;
        # Cleared: an empty value means nginx doesn't forward the header at all.
        proxy_set_header X-Admin-Device "";
        proxy_pass http://portfolio_api_upstream;
    }
}

# ── admin: CMS behind the device gate ────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.mehdisafarzade.dev;
    include /etc/nginx/snippets/portfolio-origin-tls.conf;

    # Must come first: 404 for any request without an enrolled device cookie.
    include /etc/nginx/snippets/device-gate.conf;

    client_max_body_size 1m;

    # Same-origin admin API → portfolio-api /v1/admin/*. X-Admin-Device is set from
    # the gate map and overwrites anything the client sent.
    location /api/auth/ {
        limit_req zone=pf_admin_auth burst=5 nodelay;
        include /etc/nginx/snippets/portfolio-proxy.conf;
        proxy_set_header X-Admin-Device $dg_device;
        proxy_pass http://portfolio_api_upstream/v1/admin/auth/;
    }

    location /api/ {
        include /etc/nginx/snippets/portfolio-proxy.conf;
        proxy_set_header X-Admin-Device $dg_device;
        proxy_pass http://portfolio_api_upstream/v1/admin/;
    }

    location / {
        include /etc/nginx/snippets/portfolio-proxy.conf;
        proxy_set_header X-Admin-Device $dg_device;
        proxy_pass http://portfolio_admin_upstream;
    }
}
