# ─────────────────────────────────────────────────────────────────────────────
# Device gate: server{}-level check (PLAN.md §8.2). GENERIC: include it in the
# server{} of any gated host, before its locations:
#
#     include /etc/nginx/snippets/device-gate.conf;
#
# Every request (/, /_next/*, /api/*, anything) needs an enrolled `__Host-dg`
# cookie, or it gets nginx's plain 404. The only exception is the one-time unlock
# URL, which itself 404s unless an enrollment is in progress. Locations in the
# including server{} must NOT declare their own add_header (that would drop the
# server-level ones below).
# ─────────────────────────────────────────────────────────────────────────────

# The server-level `if` runs in the rewrite phase, BEFORE location matching, so
# the unlock URI is exempted explicitly; its own location does the checking.
set $dg_ok $dg_device;
if ($uri = /__dg/unlock) {
    set $dg_ok "unlock";
}
if ($dg_ok = "") {
    return 404;
}

# Never cacheable, never indexed: a Cloudflare- or browser-cached copy could be
# served to someone the gate would stop.
add_header Cache-Control "private, no-store" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Referrer-Policy "no-referrer" always;

location = /__dg/unlock {
    # No standard access log: the query string carries the unlock key.
    access_log /var/log/nginx/device-gate.log dg_enroll;
    limit_req zone=dg_unlock burst=3 nodelay;

    # No live key → the same 404 as everything else. (add_header without `always`
    # below never applies to this 404, so no empty Set-Cookie can leak out.)
    if ($dg_unlock_token = "") {
        return 404;
    }

    # Repeated because a location's add_header replaces the inherited ones.
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    # Host-bound (no Domain), Secure, HttpOnly. Lax so bookmarks and links still send it.
    add_header Set-Cookie "__Host-dg=$dg_unlock_token; Path=/; Max-Age=31536000; Secure; HttpOnly; SameSite=Lax";
    # Relative Location: correct behind Cloudflare and on a non-443 local port alike.
    absolute_redirect off;
    return 302 /;
}
