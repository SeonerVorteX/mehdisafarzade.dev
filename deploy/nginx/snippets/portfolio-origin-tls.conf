# TLS for every mehdisafarzade.dev vhost: Cloudflare Origin Certificate + Authenticated
# Origin Pulls. Kept in one snippet so the gate test harness can swap in a
# self-signed cert without editing the vhost file under test.
ssl_certificate     /etc/ssl/cloudflare/mehdisafarzade.dev.pem;
ssl_certificate_key /etc/ssl/cloudflare/mehdisafarzade.dev.key;
ssl_protocols       TLSv1.2 TLSv1.3;

# Authenticated Origin Pulls, rolled out in stages (PLAN.md §9.6):
#   1. this bundle = our per-hostname AOP CA + Cloudflare's shared zone-level CA
#   2. enable per-hostname AOP in Cloudflare and confirm our leaf is presented
#   3. switch to mehdisafarzade.dev-aop-ca.pem ONLY, so another Cloudflare zone pointed at
#      this IP can no longer pass the check
ssl_client_certificate /etc/ssl/cloudflare/mehdisafarzade.dev-aop-bundle.pem;
ssl_verify_client on;
