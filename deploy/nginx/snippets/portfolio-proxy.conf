# Common proxy settings for every mehdisafarzade.dev location. Included INSIDE each
# location: a location that sets any proxy_set_header drops all inherited ones.
# X-Admin-Device is deliberately NOT here; every location sets it explicitly
# (admin: $dg_device, everything else: "", so a client can't smuggle one in).
proxy_http_version 1.1;
proxy_set_header Host              $host;
# $remote_addr is the real visitor (real_ip_header CF-Connecting-IP in nginx.conf).
# X-Forwarded-For is overwritten rather than appended, so a client-supplied chain can't leak through.
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Connection        "";
proxy_connect_timeout 5s;
proxy_read_timeout    60s;
