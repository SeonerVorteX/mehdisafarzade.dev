# Local development gate: https://localhost:8443
# The SAME conf.d/device-gate.conf + snippets/device-gate.conf as production, in front of
# the local admin app (next dev on :5603) and API (nest on :3100). Started with
# `deploy/device-gate/gate.ps1 up -Target local`; devices enrolled with `-Target local`.
# The host is plain `localhost` (not admin.localhost): no hosts-file entry needed, and
# browsers treat it as a secure context, so the __Host- cookies behave as in production.

map $http_upgrade $dg_dev_connection {
    default upgrade;
    ''      '';
}

server {
    listen 443 ssl http2;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/device-gate.conf;

    client_max_body_size 1m;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        proxy_set_header X-Admin-Device    $dg_device;
        proxy_pass http://host.docker.internal:3100/v1/admin/;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # next dev hot reload runs over a websocket
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $dg_dev_connection;
        proxy_set_header X-Admin-Device    $dg_device;
        proxy_read_timeout 1h;
        proxy_pass http://host.docker.internal:5603;
    }
}
