# Local development + test services. Every container/volume is `portfolio-*` prefixed and
# every host port differs from Examination's dev stack (db-dev 5434, db-test 5435,
# redis-dev 6381, rabbitmq-dev 5672/15672), so both stacks can run side by side.
# Throwaway local data only; no auth hardening here (prod uses the shared infra stack).
name: portfolio-dev

networks:
    portfolio-dev:

volumes:
    portfolio-pgdata-dev:
    portfolio-pgdata-test:
    portfolio-rabbitmq-dev-data:
    portfolio-redis-dev-data:
    portfolio-s3-dev-data:

services:
    db-dev:
        image: postgres:18
        container_name: portfolio-db-dev
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-portfolio}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
            POSTGRES_DB: ${POSTGRES_DB:-portfolio}
        volumes:
            - portfolio-pgdata-dev:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 5s
            timeout: 3s
            retries: 20
        networks: [portfolio-dev]
        ports:
            - '127.0.0.1:5436:5432'

    db-test:
        image: postgres:18
        container_name: portfolio-db-test
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-portfolio}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
            POSTGRES_DB: ${POSTGRES_DB:-portfolio_test}
        tmpfs:
            - /var/lib/postgresql # test data is disposable; faster and always clean
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 2s
            timeout: 3s
            retries: 30
        networks: [portfolio-dev]
        ports:
            - '127.0.0.1:5437:5432'

    redis-dev:
        image: redis:7-alpine
        container_name: portfolio-redis-dev
        volumes:
            - portfolio-redis-dev-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10
        networks: [portfolio-dev]
        ports:
            - '127.0.0.1:6382:6379'

    rabbitmq-dev:
        image: rabbitmq:3.13-management
        container_name: portfolio-rabbitmq-dev
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-portfolio}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-portfolio}
            RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-portfolio}
        volumes:
            - portfolio-rabbitmq-dev-data:/var/lib/rabbitmq
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
            interval: 10s
            timeout: 5s
            retries: 10
        networks: [portfolio-dev]
        ports:
            - '127.0.0.1:5673:5672'
            - '127.0.0.1:15673:15672'

    # S3-compatible storage for local media work so dev never needs real AWS credentials.
    # SeaweedFS rather than MinIO: MinIO no longer publishes images to Docker Hub/Quay.
    # Credentials come from dev/seaweedfs-s3.json (dev-only, committed on purpose).
    s3-dev:
        image: chrislusf/seaweedfs:latest
        container_name: portfolio-s3-dev
        command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
        volumes:
            - portfolio-s3-dev-data:/data
            - ./dev/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
        networks: [portfolio-dev]
        ports:
            - '127.0.0.1:9002:8333'

    # Catches every outgoing email in dev (UI on :8026) so the contact round-trip can be tested without SES.
    mailpit-dev:
        image: axllent/mailpit:latest
        container_name: portfolio-mailpit-dev
        networks: [portfolio-dev]
        ports:
            - '127.0.0.1:1026:1025'
            - '127.0.0.1:8026:8025'
